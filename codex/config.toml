[features]
multi_agent = true
apps = true
network_proxy = false
prevent_idle_sleep = true
terminal_resize_reflow = true
memories = true
external_migration = true
context_management.experimental_mode = true

[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 300000
default_wait_timeout_ms = 300000
max_wait_timeout_ms = 1740000

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[tui]
notification_condition = "always"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "run-state", "context-used", "context-window-size", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
screen_reader_detection_done = true

[agents]
enabled = true
max_concurrent_threads_per_session = 50
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "xhigh"

# Hard-block guard for unsandboxed runs (mirrors ~/.claude settings deny list + guard-bash.sh).
[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/guard_shell.py"
timeout = 30
statusMessage = "Checking command against the block list"
