model = "gpt-6-astra"
model_reasoning_effort = "medium"
personality = "friendly"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
default_permissions = ":danger-full-access"
plan_mode_reasoning_effort = "high"

[auto_review]
policy = """
Reversible destructive commands are allowed. 
File deletions in version-controlled repos are fine. 
No destructive commands outside of git repos: agent should ask me to run.
No destructive git commands: agent should ask me to run.
Non-destructive git reads and writes are allowed.
It's fine to hit beta infra read or write. 
It's fine to hit prod infra for reads but not writes/alterations.
Using secrets via scripts to run commands is fine. Don't read secrets in plain text in the session or print to logs!
Block dangerous large `rm -rf`, `git reset --hard` and similar "nuclear" commands.
"""

[sandbox_workspace_write]
network_access = true
writable_roots = ["~/.codex/memories", "~/.cache", "~/.pytensor"]

[permissions.danger_full_access.filesystem]
glob_scan_max_depth = 4
":root" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"/var/run/docker.sock" = "write"
[permissions.danger_full_access.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*secret*" = "deny"
"**/*token*" = "deny"
"**/*credential*" = "deny"

[permissions.danger_full_access.network]
enabled = true
mode = "full"
allow_local_binding = true

