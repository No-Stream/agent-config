<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade the passages</title>
<style>
:root {
  color-scheme: light dark;
  --text: #1b1c1e; --muted: #5d6166; --page: #ffffff; --panel: #f3f4f6;
  --rule: #d5d8dc; --accent: #1a56c4; --on-accent: #ffffff; --done: #1e7a34;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #e6e7e9; --muted: #a3a7ad; --page: #141518; --panel: #212328;
    --rule: #3b3f45; --accent: #7fa8ff; --on-accent: #0c1424; --done: #74d184;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }
.bar {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--page); border-bottom: 1px solid var(--rule);
}
.bar .count { flex: 1; font-size: 15px; color: var(--muted); }
.bar nav { display: flex; gap: 6px; }
.bar nav button {
  min-width: 42px; height: 42px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--panel);
}
.bar nav button.done { border-color: var(--done); color: var(--done); font-weight: 600; }
.bar nav button[aria-current="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
main { max-width: 70ch; margin: 0 auto; padding: 0 16px 64px; }
h1 { font-size: 22px; margin: 20px 0 10px; }
.brief { background: var(--panel); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
.brief p { margin: 6px 0; }
.brief .label {
  display: block; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted);
}
.hint { font-size: 15px; color: var(--muted); margin: 8px 0 0; }
.passage { border-top: 1px solid var(--rule); margin-top: 18px; padding-top: 16px; }
.passage h2 { font-size: 19px; margin: 0 0 8px; }
.passage h2 .chosen { color: var(--accent); margin-left: 6px; }
.text p, .text ul, .text ol, .text pre, .text .table { margin: 0 0 12px; }
.text ul, .text ol { padding-left: 1.4em; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em;
  background: var(--panel); border-radius: 4px; padding: 0.05em 0.3em; overflow-wrap: anywhere;
}
pre {
  background: var(--panel); border-radius: 8px; padding: 10px 12px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
pre code { background: none; padding: 0; }
.table { overflow-x: auto; }
table { border-collapse: collapse; font-size: 15px; line-height: 1.4; }
th, td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 14px; }
.grades .letter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grades button {
  min-height: 46px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--panel); font-size: 17px; font-weight: 600;
}
.grades button[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.note { display: block; margin-top: 26px; font-size: 15px; color: var(--muted); }
.note input {
  display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font: inherit;
  color: var(--text); background: var(--page); border: 1px solid var(--rule); border-radius: 8px;
}
.steps { display: flex; gap: 10px; margin: 22px 0 28px; }
.steps button {
  flex: 1; min-height: 50px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--panel);
}
.result { border-top: 2px solid var(--rule); padding-top: 14px; }
.result h2 { font-size: 19px; margin: 0 0 6px; }
.result p { font-size: 15px; color: var(--muted); margin: 4px 0 10px; }
.result textarea {
  display: block; width: 100%; padding: 10px; resize: vertical;
  font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--text); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
}
.copy { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.copy button {
  min-height: 50px; padding: 0 26px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent); font-weight: 600;
}
.copy span { font-size: 15px; }
</style>
</head>
<body>
<header class="bar">
  <span class="count" id="graded-count"></span>
  <nav class="tasks" aria-label="Tasks">{{NAV}}</nav>
</header>
<main>
<p class="hint">Grade each passage on how well it serves the intended reader in this kind of document. Tap a grade again to clear it.</p>
{{TASKS}}
<section class="result" id="result">
  <h2>Result</h2>
  <p>To send your grades, finished or not, copy this line and paste it as your answer. A task enters the line once all its passages have a grade.</p>
  <p id="result-coverage"></p>
  <textarea id="result-line" rows="4" readonly spellcheck="false" aria-label="Result line"></textarea>
  <div class="copy">
    <button type="button" id="select-line">Select</button>
    <span id="copy-status" role="status"></span>
  </div>
</section>
</main>
<script type="application/json" id="rater-meta">{{META}}</script>
<script>
"use strict";
(() => {
  const meta = JSON.parse(document.getElementById("rater-meta").textContent);
  const namePrefix = meta.version + "-rater:";
  const hashPrefix = "#" + meta.version + "=";
  const tasks = Array.from(document.querySelectorAll("section.task"));
  const navButtons = Array.from(document.querySelectorAll("nav.tasks button"));
  const lineBox = document.getElementById("result-line");
  const copyStatus = document.getElementById("copy-status");
  const setById = new Map(meta.sets.map((set) => [set.id, set]));
  const totalPassages = meta.sets.reduce((sum, set) => sum + set.letters.length, 0);
  if (tasks.map((section) => section.dataset.set).join() !== meta.sets.map((set) => set.id).join()) {
    throw new Error("the task sections do not match the sets in the page's metadata");
  }

  function savedState() {
    const fromName = window.name.startsWith(namePrefix) ? window.name.slice(namePrefix.length) : null;
    const fromHash = location.hash.startsWith(hashPrefix)
      ? decodeURIComponent(location.hash.slice(hashPrefix.length)) : null;
    for (const text of [fromName, fromHash]) {
      if (text !== null) {
        const saved = JSON.parse(text);
        if (saved.digest === meta.digest) return saved;
      }
    }
    return {
      digest: meta.digest,
      task: 0,
      grades: Object.fromEntries(meta.sets.map((set) => [set.id, {}])),
      notes: Object.fromEntries(meta.sets.map((set) => [set.id, ""])),
    };
  }

  const state = savedState();
  let saveTimer = null;

  function save() {
    clearTimeout(saveTimer);
    const text = JSON.stringify(state);
    window.name = namePrefix + text;
    history.replaceState(null, "", hashPrefix + encodeURIComponent(text));
  }

  function gradedIn(set) {
    return set.letters.filter((letter) => state.grades[set.id][letter]).length;
  }

  function resultLine() {
    const parts = [meta.version, meta.digest];
    const notes = {};
    for (const set of meta.sets) {
      if (gradedIn(set) === set.letters.length) {
        parts.push(set.id + ":" + set.letters.map((letter) => state.grades[set.id][letter]).join(","));
        const note = state.notes[set.id].trim();
        if (note) notes[set.id] = note;
      }
    }
    parts.push("notes=" + JSON.stringify(notes));
    return parts.join(" ");
  }

  function coverage() {
    const done = [];
    const open = [];
    meta.sets.forEach((set, index) => {
      const graded = gradedIn(set);
      if (graded === set.letters.length) done.push(index + 1);
      else open.push((index + 1) + (graded ? " (" + graded + " of " + set.letters.length + " graded)" : ""));
    });
    const tasksWord = (count) => (count === 1 ? "task " : "tasks ");
    if (!done.length) return "No task is fully graded yet.";
    if (!open.length) return "The line holds all " + done.length + " tasks.";
    return "The line holds " + tasksWord(done.length) + done.join(", ") + ". Not yet in it: "
      + tasksWord(open.length) + open.join(", ") + ".";
  }

  function render() {
    tasks.forEach((section, index) => {
      const set = setById.get(section.dataset.set);
      section.hidden = index !== state.task;
      for (const article of section.querySelectorAll("article.passage")) {
        const grade = state.grades[set.id][article.dataset.letter] || "";
        article.querySelector(".chosen").textContent = grade;
        for (const button of article.querySelectorAll("button[data-grade]")) {
          button.setAttribute("aria-pressed", String(button.dataset.grade === grade));
        }
      }
      const note = section.querySelector("input[data-note]");
      if (note.value !== state.notes[set.id]) note.value = state.notes[set.id];
      navButtons[index].classList.toggle("done", gradedIn(set) === set.letters.length);
      navButtons[index].setAttribute("aria-current", String(index === state.task));
    });
    const graded = meta.sets.reduce((sum, set) => sum + gradedIn(set), 0);
    document.getElementById("graded-count").textContent = "Graded " + graded + " of " + totalPassages;
    lineBox.value = resultLine();
    document.getElementById("result-coverage").textContent = coverage();
  }

  function showTask(index) {
    state.task = index;
    save();
    render();
    window.scrollTo(0, 0);
  }

  async function selectLine() {
    lineBox.focus();
    lineBox.setSelectionRange(0, lineBox.value.length);
    let copied = document.execCommand("copy");
    if (!copied && navigator.clipboard) {
      copied = await navigator.clipboard.writeText(lineBox.value).then(() => true, () => false);
    }
    copyStatus.textContent = copied
      ? "Copied. Paste it as your answer."
      : "Selected. Copy it with your browser's Copy command.";
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.grade) {
      const grades = state.grades[button.closest("section.task").dataset.set];
      const letter = button.closest("article.passage").dataset.letter;
      if (grades[letter] === button.dataset.grade) delete grades[letter];
      else grades[letter] = button.dataset.grade;
      save();
      render();
    } else if (button.dataset.go !== undefined) {
      showTask(Number(button.dataset.go));
    } else if (button.dataset.step) {
      showTask(state.task + Number(button.dataset.step));
    } else if (button.hasAttribute("data-to-result")) {
      document.getElementById("result").scrollIntoView({ behavior: "smooth" });
    } else if (button.id === "select-line") {
      selectLine();
    }
  });

  document.addEventListener("input", (event) => {
    if (!event.target.matches("input[data-note]")) return;
    state.notes[event.target.closest("section.task").dataset.set] = event.target.value;
    lineBox.value = resultLine();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  });

  document.addEventListener("keydown", (event) => {
    if (event.target.matches("input, textarea") || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === "ArrowLeft" && state.task > 0) showTask(state.task - 1);
    if (event.key === "ArrowRight" && state.task < tasks.length - 1) showTask(state.task + 1);
  });

  window.addEventListener("pagehide", save);
  render();
})();
</script>
</body>
</html>
