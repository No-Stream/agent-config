# Matched pairs: each human text was published before 2022, and each model half was written by
# claude-opus-5 from the same topic, audience and points, never shown the human text.
# Registers come from the index; `sides` maps the index's keys to this file's sides.
[[pairs]]
name = "bheijden-slop"
repo = "https://github.com/bheijden/slop.git"
revision = "56f7b8689b063191e1b971d0a63e57f4f7c8e0d5"
index = "data/corpus/pairs.json"
sides = { human = "human", ai = "agent" }
